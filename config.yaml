mouth:
  closed_angle: 90            # angle when mouth is fully closed
  open_angle: 140             # angle when mouth is fully open
  open_direction: positive    # 'positive' or 'negative'
  channel: 0                  # PCA9685 channel used for the mouth
  smoothing: 0.2              # smoothing factor for envelope response

eyes:
  channel: 1
  min_angle: 45
  max_angle: 120
  smoothing: 0.3

mic:
  listen_timeout: 5
  phrase_timeout: 5
  device_index: 0

envelope:
  min_threshold: 0.005        # envelope value for fully closed mouth
  max_threshold: 0.1          # envelope value for fully open mouth

tts:
  engine: espeak              # 'coqui' or 'pyttsx3'
  voice: female               # 'female' or 'male'

llm:
  engine: openai              # Options: 'openai', 'claude', 'gemini', 'codex', or 'local'
  model: 4.1                  # For OpenAI: model version (e.g., 4.1 for gpt-4.1)
  model_path: /models/model.gguf  # For local LLM: path to model file
  prompt_file: prompts/system_prompt.txt

  # Engine-specific notes:
  # - openai: Requires OPENAI_API_KEY environment variable
  # - claude: Requires Anthropic CLI (pip install anthropic-cli)
  # - gemini: Requires Google AI CLI (pip install google-generativeai)
  # - codex: Requires OpenAI CLI (pip install openai-cli)
  # - local: Not yet implemented

